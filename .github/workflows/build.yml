name: Build Akini APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use a private signing key (only if configured in repo secrets)
        env:
          KEYSTORE_B64: ${{ secrets.AKINI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AKINI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using private signing key from secrets."
          else
            echo "No private key configured; using the project's published key."
          fi

      - name: Build release APK
        env:
          AKINI_VERSION_CODE: ${{ github.run_number }}
          AKINI_VERSION_NAME: 1.0.${{ github.run_number }}
          AKINI_KEYSTORE_PASSWORD: ${{ secrets.AKINI_KEYSTORE_PASSWORD }}
          AKINI_KEY_ALIAS: ${{ secrets.AKINI_KEY_ALIAS }}
          AKINI_KEY_PASSWORD: ${{ secrets.AKINI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Akini.apk
          sha256sum Akini.apk | tee Akini.apk.sha256

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akini-1.0.${{ github.run_number }}
          path: |
            Akini.apk
            Akini.apk.sha256

      - name: Publish a GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Akini.apk Akini.apk.sha256 \
            --title "Akini 1.0.${{ github.run_number }}" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. No ads, no trackers, no permissions. Download **Akini.apk** below and open it on your phone." \
            --latest
